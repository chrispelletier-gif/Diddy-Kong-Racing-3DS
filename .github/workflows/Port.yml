name: 3DS port

# Builds the native port (port/) on every push: dkr.3dsx for the 3DS and the headless host build, then plays the
# host build through the scripted scenarios in port/tools/frame_regression.py and compares its frames with the
# build of the previous commit.
#
# Needs the ROMURL repository secret (the same one the N64 workflows use): a private download URL for a US 1.0
# ROM (sha1 0cb115d8716dbbc2922fda38e533b9fe63bb9670). The ROM is only used inside the jobs; it is never uploaded.
#
# Pushing a version tag (vX.Y.Z, or vX.Y.Z-label such as v0.1.0-beta) builds that commit and makes a draft GitHub
# Release of it with the player's dkr.3dsx and dkr.cia (job release-3ds). Nothing is public until the draft is
# published on GitHub. The builds take their version from the newest such tag (port/Makefile).
# Without git, the tag can be made from the website with the "Tag a 3DS release" workflow (Tag.yml).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-${{ github.ref }}
  cancel-in-progress: true

env:
  ROM_SHA1: 0cb115d8716dbbc2922fda38e533b9fe63bb9670

jobs:
  assets:
    name: Asset headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get ROM
        env:
          ROMURL: ${{ secrets.ROMURL }}
        run: |
          if [ -z "$ROMURL" ]; then
            echo "::error::The ROMURL repository secret is not set. Add a private download URL for the US 1.0 ROM under Settings > Secrets and variables > Actions."
            exit 1
          fi
          wget -q --timeout=60 -O baseroms/baserom.us.v77.z64 "$ROMURL"
          echo "$ROM_SHA1  baseroms/baserom.us.v77.z64" | sha1sum -c --quiet -

      - name: Build the asset tool
        run: make -C tools dkr_assets_tool -j4

      - name: Extract and build the assets
        run: |
          ./tools/dkr_assets_tool extract -dkrv us.v77
          ./tools/dkr_assets_tool build -o build/assets.bin -dkrv us.v77

      - name: Upload include/asset_enums.h
        uses: actions/upload-artifact@v4
        with:
          name: asset-enums
          path: include/asset_enums.h
          retention-days: 1

  # Two builds: the debug one (the default; profiler, test runs, bug reports, updates and the performance switches in
  # its menus), which the updater publishes, and the player's build (RELEASE=1), which leaves those out of the menus.
  build-3ds:
    name: 3DS build (${{ matrix.variant }})
    needs: assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: debug
            make-flags: ""
            out: port/build/3ds
            artifact: dkr-3ds
          - variant: release
            make-flags: RELEASE=1
            out: port/build/3ds-release
            artifact: dkr-3ds-release
    # devkitARM with libctru and citro3d. To update, pull devkitpro/devkitarm:latest and use its digest.
    container: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The history and tags, for the version (git describe).
          fetch-depth: 0

      - name: Download include/asset_enums.h
        uses: actions/download-artifact@v4
        with:
          name: asset-enums
          path: include

      - name: Build dkr.3dsx
        run: make -C port TARGET=3ds ${{ matrix.make-flags }} -j"$(nproc)"

      # Old 3DS instruction cache budget (P56): fails the debug build when the hot renderer code grows past its budget
      # or memcpy calls itself / memmove / memset; the player's build only prints the numbers.
      - name: Hot code size and memcpy check
        run: |
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }
          bin="${DEVKITARM:-/opt/devkitpro/devkitARM}/bin"
          python3 port/tools/hot_size.py ${{ matrix.out }}/dkr.elf --nm "$bin/arm-none-eabi-nm" \
            --objdump "$bin/arm-none-eabi-objdump" ${{ matrix.variant == 'release' && '--report-only' || '' }}

      # makerom and bannertool are not in devkitPro; fetch pinned releases and check them before use.
      - name: Install makerom and bannertool
        run: |
          command -v unzip >/dev/null || { apt-get update && apt-get install -y unzip; }
          mkdir -p /tmp/cia-tools && cd /tmp/cia-tools
          curl -sSfL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl -sSfL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          sha256sum -c - <<'SUMS'
          dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970  makerom.zip
          69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip
          SUMS
          unzip -o -q makerom.zip && unzip -o -q -j bannertool.zip linux-x86_64/bannertool
          chmod +x makerom bannertool

      - name: Build dkr.cia
        run: make -C port TARGET=3ds ${{ matrix.make-flags }} cia MAKEROM=/tmp/cia-tools/makerom BANNERTOOL=/tmp/cia-tools/bannertool

      - name: Upload dkr.3dsx
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          # dkr.elf has the symbols for reading crash addresses.
          path: |
            ${{ matrix.out }}/dkr.3dsx
            ${{ matrix.out }}/dkr.cia
            ${{ matrix.out }}/dkr.elf

  # Profile-guided builds (P69, port/pgo/README.md), debug like the newest build so they have the same test runs:
  #   dkr-pgo        PGO=use PGO_LEAN=1 from port/pgo/pgo_counts.bin: branch layout and hot/cold placement from the
  #                  counts, no extra unrolling or cloning (the full PGO build was 12% bigger and slower, #331)
  #   dkr-pgo-train  PGO=gen, the training build: its Whole game run writes the counts that refresh pgo_counts.bin
  # Each .cia installs as a title of its own ("DKR PGO", "DKR PGO training") next to the usual one. The hot code size is
  # only reported: the budgets are the usual build's. A failure here never stops the usual build's publish.
  build-3ds-pgo:
    name: 3DS build (profile-guided)
    needs: assets
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download include/asset_enums.h
        uses: actions/download-artifact@v4
        with:
          name: asset-enums
          path: include

      - name: Install makerom and bannertool
        run: |
          command -v unzip >/dev/null || { apt-get update && apt-get install -y unzip; }
          command -v python3 >/dev/null || { apt-get update && apt-get install -y python3; }
          mkdir -p /tmp/cia-tools && cd /tmp/cia-tools
          curl -sSfL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          curl -sSfL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          sha256sum -c - <<'SUMS'
          dd596854718c195c6e3229286be485b122921715555af8ae5cf8e9a465d9f970  makerom.zip
          69768596f836acb3e3aeaa66e47c6ba560dde813c6dfcd33c8afc25fe29b7524  bannertool.zip
          SUMS
          unzip -o -q makerom.zip && unzip -o -q -j bannertool.zip linux-x86_64/bannertool
          chmod +x makerom bannertool

      # Both builds use port/build/3ds-pgo (the counts are found by object path), one after the other.
      - name: Build dkr-pgo (lean, from port/pgo/pgo_counts.bin)
        run: |
          python3 port/tools/pgo_unpack.py port/pgo/pgo_counts.bin --to port
          make -C port TARGET=3ds PGO=use PGO_LEAN=1 -j"$(nproc)" 2> pgo-warnings.txt || { cat pgo-warnings.txt; exit 1; }
          make -C port TARGET=3ds PGO=use PGO_LEAN=1 cia MAKEROM=/tmp/cia-tools/makerom BANNERTOOL=/tmp/cia-tools/bannertool
          mkdir -p out
          for f in 3dsx cia elf; do cp port/build/3ds-pgo/dkr.$f out/dkr-pgo.$f; done
          {
            echo "### Profile-guided build"
            echo "Functions built without their counts (changed since the training run): $(grep 'control flow checksum\|number of counters' pgo-warnings.txt | grep -o "function '[^']*'" | sort -u | wc -l)"
            echo "Functions whose counts were kept although they moved: $(grep 'source locations' pgo-warnings.txt | grep -o "function '[^']*'" | sort -u | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hot code size of dkr-pgo (report only)
        run: |
          bin="${DEVKITARM:-/opt/devkitpro/devkitARM}/bin"
          python3 port/tools/hot_size.py out/dkr-pgo.elf --nm "$bin/arm-none-eabi-nm" --objdump "$bin/arm-none-eabi-objdump" \
            --report-only

      - name: Build dkr-pgo-train (training build)
        run: |
          rm -rf port/build/3ds-pgo
          make -C port TARGET=3ds PGO=gen -j"$(nproc)"
          make -C port TARGET=3ds PGO=gen cia MAKEROM=/tmp/cia-tools/makerom BANNERTOOL=/tmp/cia-tools/bannertool
          for f in 3dsx cia elf; do cp port/build/3ds-pgo/dkr.$f out/dkr-pgo-train.$f; done

      - name: Upload the profile-guided builds
        uses: actions/upload-artifact@v4
        with:
          name: dkr-3ds-pgo-${{ github.sha }}
          path: out/

  # Releases (all pre-releases, each holding dkr.3dsx, the installable dkr.cia and build.txt):
  #   3ds-master        the player build (RELEASE=1) of master: the one to download and play
  #   3ds-master-debug  the debug build of master
  #   3ds-newest        the debug build of the latest push to any branch
  # The debug builds' Check for updates button (port/3ds/update_3ds.c) installs 3ds-master-debug or 3ds-newest, so it
  # never swaps a debug build for a player build.
  publish-3ds:
    name: Publish the 3DS build
    # Only once the PC build has played its scenarios without a crash, hang or repeatability failure.
    # The profile-guided builds are added to 3ds-newest when they built; their failure doesn't hold this up.
    needs: [build-3ds, host, build-3ds-pgo]
    if: >-
      !cancelled() && needs.build-3ds.result == 'success' && needs.host.result == 'success' &&
      github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time; a newer build waiting replaces an older one.
    concurrency:
      group: port-publish-3ds
    steps:
      - name: Download the debug dkr.3dsx
        uses: actions/download-artifact@v4
        with:
          name: dkr-3ds-${{ github.sha }}
          path: build/debug

      - name: Download the player dkr.3dsx
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/download-artifact@v4
        with:
          name: dkr-3ds-release-${{ github.sha }}
          path: build/release

      - name: Download the profile-guided builds
        if: needs.build-3ds-pgo.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dkr-3ds-pgo-${{ github.sha }}
          path: build/pgo

      - name: Write build.txt
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          for dir in build/debug build/release; do
            [ -f "$dir/dkr.3dsx" ] || continue
            printf 'commit=%s\nbranch=%s\ndate=%s\nsize=%s\nsha256=%s\n' "$GITHUB_SHA" "$BRANCH" \
              "$(date -u +%Y-%m-%dT%H:%MZ)" "$(stat -c %s "$dir/dkr.3dsx")" \
              "$(sha256sum "$dir/dkr.3dsx" | cut -d' ' -f1)" > "$dir/build.txt"
            # A .cia build updates itself from these (port/3ds/update_3ds.c).
            if [ -f "$dir/dkr.cia" ]; then
              printf 'cia_size=%s\ncia_sha256=%s\n' "$(stat -c %s "$dir/dkr.cia")" \
                "$(sha256sum "$dir/dkr.cia" | cut -d' ' -f1)" >> "$dir/build.txt"
            fi
            cat "$dir/build.txt"
          done

      - name: Publish the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # publish TAG TITLE DIR NOTES
          # An existing release is updated in place (tag moved, files replaced, build.txt last) rather than deleted
          # and made again: a newer push cancels this run, and a cancel between a delete and a create would leave the
          # updaters with no release. A half-updated release is safe: the updater checks the file against build.txt.
          publish() {
            notes="3DS build of $BRANCH at $GITHUB_SHA, made by CI. $4"
            if gh release view "$1" >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$1" -f sha="$GITHUB_SHA" -F force=true >/dev/null ||
                gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$1" -f sha="$GITHUB_SHA" >/dev/null
              gh release edit "$1" --prerelease --title "$2" --notes "$notes"
              if [ -f "$3/dkr.cia" ]; then
                gh release upload "$1" --clobber "$3/dkr.3dsx" "$3/dkr.cia"
              else
                gh release upload "$1" --clobber "$3/dkr.3dsx"
                gh release delete-asset "$1" dkr.cia --yes 2>/dev/null || true
              fi
              gh release upload "$1" --clobber "$3/build.txt"
            else
              gh release create "$1" --prerelease --target "$GITHUB_SHA" --title "$2" --notes "$notes" \
                "$3/dkr.3dsx" "$3/build.txt" $(ls "$3/dkr.cia" 2>/dev/null)
            fi
          }
          DEBUG_NOTE="Debug build (profiler, test runs, bug reports, updates); install it from the game's Check for updates button."
          publish 3ds-newest "3DS build: newest ($BRANCH, debug)" build/debug "$DEBUG_NOTE"
          # The profile-guided builds of the same commit (own HOME menu titles), or none: never an older commit's.
          pgo_files="dkr-pgo.3dsx dkr-pgo.cia dkr-pgo-train.3dsx dkr-pgo-train.cia"
          if [ -f build/pgo/dkr-pgo.cia ] && [ -f build/pgo/dkr-pgo-train.cia ]; then
            gh release upload 3ds-newest --clobber $(for f in $pgo_files; do echo "build/pgo/$f"; done)
          else
            for f in $pgo_files; do gh release delete-asset 3ds-newest "$f" --yes 2>/dev/null || true; done
          fi
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            publish 3ds-master-debug "3DS build: master (debug)" build/debug "$DEBUG_NOTE"
            publish 3ds-master "3DS build: master" build/release \
              "Copy your own US 1.0 ROM to sdmc:/3ds/dkr/baserom.z64. Then either copy dkr.3dsx to sdmc:/3ds/ and start it from the Homebrew Launcher, or install dkr.cia with FBI to get a HOME menu icon."
          fi

  # A version tag's release: a draft (publish it on GitHub to make it public), marked a pre-release when the version
  # has a label (v0.1.0-beta). Its notes are port/release-notes/<tag>.md when that file exists. Unlike the 3ds-*
  # pre-releases it never moves; pushing the same tag again only replaces a draft, never a published release.
  release-3ds:
    name: Release the 3DS build
    needs: build-3ds
    # Tag.yml starts this workflow on a tag it made (workflow_dispatch), since its push doesn't.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the player build
        uses: actions/download-artifact@v4
        with:
          name: dkr-3ds-release-${{ github.sha }}
          path: build/release

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$TAG is not a version tag (vX.Y.Z or vX.Y.Z-label)."
            exit 1
          fi
          cd build/release
          printf 'version=%s\ncommit=%s\ndate=%s\nsize=%s\nsha256=%s\n' "${TAG#v}" "$GITHUB_SHA" \
            "$(date -u +%Y-%m-%dT%H:%MZ)" "$(stat -c %s dkr.3dsx)" "$(sha256sum dkr.3dsx | cut -d' ' -f1)" > build.txt
          sha256sum dkr.3dsx dkr.cia > SHA256SUMS.txt
          cat build.txt SHA256SUMS.txt
          notes="$GITHUB_WORKSPACE/port/release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            notes=$RUNNER_TEMP/notes.md
            {
              echo "Diddy Kong Racing for the New Nintendo 3DS, version ${TAG#v} (commit $GITHUB_SHA)."
              echo
              echo "You need your own US 1.0 ROM: copy it to \`sdmc:/3ds/dkr/baserom.z64\`. Then either copy dkr.3dsx to"
              echo "\`sdmc:/3ds/\` and start it from the Homebrew Launcher, or install dkr.cia with FBI to get a HOME menu icon."
              echo "SHA256SUMS.txt has the files' checksums."
            } > "$notes"
          fi
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = false ]; then
            echo "::error::$TAG is already published; make a new version tag instead of moving this one."
            exit 1
          fi
          [ "$state" = true ] && gh release delete "$TAG" --yes
          gh release create "$TAG" --draft --verify-tag --title "Diddy Kong Racing 3DS ${TAG#v}" \
            --notes-file "$notes" $(case "$TAG" in *-*) echo --prerelease;; esac) \
            dkr.3dsx dkr.cia SHA256SUMS.txt build.txt

  host:
    name: Host build and frame regression
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib python3-pil gcc-arm-none-eabi qemu-user zlib1g-dev

      - name: Download include/asset_enums.h
        uses: actions/download-artifact@v4
        with:
          name: asset-enums
          path: include

      - name: Get ROM
        env:
          ROMURL: ${{ secrets.ROMURL }}
        run: |
          mkdir -p "$RUNNER_TEMP/rom"
          wget -q --timeout=60 -O "$RUNNER_TEMP/rom/baserom.z64" "$ROMURL"
          echo "$ROM_SHA1  $RUNNER_TEMP/rom/baserom.z64" | sha1sum -c --quiet -

      - name: Build the host version
        run: make -C port TARGET=host -j"$(nproc)"
      - name: Profiler pages fit the terminal font
        # every page of the bottom screen's profiler, with the longest bench row, fits 47 columns by 14 lines
        run: DKR_PROF_TERM_CHECK=1 port/build/host/dkr
      - name: Profiler panel cache
        # P59 A: the readout drawn from its cached panels (DKR_BS_PANEL_CACHE) matches the old way pixel for pixel, in
        # every look, page and graph state, and a look change rebuilds the cache (host/bottom_preview.c)
        run: |
          mkdir -p "$RUNNER_TEMP/panel-cache"
          DKR_BS_PANEL_CACHE_CHECK=1 DKR_DATA_DIR="$RUNNER_TEMP/rom" DKR_BOTTOM_PREVIEW="$RUNNER_TEMP/panel-cache" \
            port/build/host/dkr | grep "panel cache"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Self-checks reach the test run's results
        # P59 E (rule K6): a fake check reported right and one wrong reach the CSV's chk cells as 2 run, 1 wrong
        run: DKR_CHECKS_CSV_TEST=1 port/build/host/dkr
      - name: Time trial bests index
        # P58 (rule K6): the bests index against its files, then its self-check broken on purpose, which must report it
        run: mkdir -p "$RUNNER_TEMP/ttbest" && DKR_DATA_DIR="$RUNNER_TEMP/ttbest" DKR_TTBEST_TEST=1 port/build/host/dkr
      - name: Switch bench overrides all reach the game
        # every switch bench race of both consoles' lists sets its switches without overflowing the override table, and
        # no row silently replaces another's usual setting (run 52); a planted list's 3 conflicts must be found
        run: |
          DKR_BENCH_OVERRIDE_CHECK=1 port/build/host/dkr
          DKR_BENCH_OVERRIDE_CHECK=1 DKR_HOST_OLD3DS=1 port/build/host/dkr
      - name: Frame start/end parts check
        # P57 E (rule K6): the 3DS backend's frame start/end parts must add up to the mix's bucket; parts that add up
        # pass, the check broken on purpose (the largest part left out) and a part counted twice must fail
        run: gcc -Wall -Werror -std=gnu99 -Iport/src -o "$RUNNER_TEMP/frame_parts_test" port/tools/frame_parts_test.c && "$RUNNER_TEMP/frame_parts_test"
      - name: Frame end cuts check
        # P57 E step 2 (rule K6): DKR_FE_FLUSH's merged cache flush must cover every command list handed to the GPU and
        # its self-check must report a range left out (the check broken on purpose); DKR_FE_QUEUE_CHECK must fail a
        # queue cleared before it finished, and its broken mode must fail a finished one
        run: gcc -Wall -Werror -std=gnu99 -o "$RUNNER_TEMP/frame_cuts_test" port/tools/frame_cuts_test.c && "$RUNNER_TEMP/frame_cuts_test"
      - name: Pictures shown logic
        # P56 K7: the replaced pictures and the longest gap between shown ones (port/src/plat/shown.h)
        run: gcc -Iport/src -o "$RUNNER_TEMP/shown_test" port/tools/shown_test.c && "$RUNNER_TEMP/shown_test"
      - name: GS hang ladder markers
        # P65 rank 4: what each step's marker file makes the next start do (port/3ds/gs_ladder.h); then broken on
        # purpose (rule K6: the "testing" comparison dropped, so a console lock would go unrecorded), which must fail.
        run: |
          gcc -Wall -Iport/3ds -o "$RUNNER_TEMP/gs_ladder_test" port/tools/gs_ladder_test.c && "$RUNNER_TEMP/gs_ladder_test"
          gcc -Wall -DGS_LADDER_BREAK -Iport/3ds -o "$RUNNER_TEMP/gs_ladder_break" port/tools/gs_ladder_test.c
          if "$RUNNER_TEMP/gs_ladder_break"; then echo "the broken test passed"; exit 1; fi
          # GS freeze test 2: every sprite GS cap sharing one marker file (a lock in one bench row would leave all off)
          gcc -Wall -DGS_CAP_BREAK -Iport/3ds -o "$RUNNER_TEMP/gs_cap_break" port/tools/gs_ladder_test.c
          if "$RUNNER_TEMP/gs_cap_break"; then echo "the broken cap test passed"; exit 1; fi
      - name: Bug report attachments from memory and streamed from the SD card
        # DKR_NET_STREAM: both come back intact through bugreport_fetch.py's joining, a growing file included
        run: |
          gcc -Iport/tools/stub_curl -Iport/src/plat -o "$RUNNER_TEMP/bugreport_stream_test" \
            port/tools/bugreport_stream_test.c port/src/plat/bugreport.c -lz
          cd "$RUNNER_TEMP" && ./bugreport_stream_test
      - name: Fused VFP vertex loop matches the C
        # P60 B: gfx_vertex_asm (DKR_VERTEX_ASM) against native_record's C passes on random vertices in an ARM11, with
        # the 3DS hot files' flags; then broken on purpose (rule K6: the C leaves the fog out), which must fail. Linked at
        # 4 MB: the toolchain's default 0x8000 is below the runner's vm.mmap_min_addr, which qemu-arm can't map.
        run: |
          arm-none-eabi-gcc -O3 -ffast-math -march=armv6k -mtune=mpcore -mfloat-abi=hard -mfpu=vfp -marm \
            -fno-math-errno -funsigned-char -fno-strict-aliasing -fwrapv -fno-common -fno-stack-protector -Wall \
            -nostdlib -static -Wl,-Ttext-segment=0x400000 -Iport/src/gfx -o "$RUNNER_TEMP/vertex_asm_test" port/tools/vertex_asm_test.c -lgcc
          qemu-arm -cpu arm11mpcore "$RUNNER_TEMP/vertex_asm_test"
          if VERTEX_ASM_BREAK=1 qemu-arm -cpu arm11mpcore "$RUNNER_TEMP/vertex_asm_test" > "$RUNNER_TEMP/vertex_asm_break.txt"; then
            cat "$RUNNER_TEMP/vertex_asm_break.txt"; echo "the broken test passed"; exit 1
          fi
          tail -1 "$RUNNER_TEMP/vertex_asm_break.txt"

      - name: Upload the host build
        uses: actions/upload-artifact@v4
        with:
          name: dkr-host-${{ github.sha }}
          path: port/build/host/dkr

      - name: Build the previous commit
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # The commit this push builds on: the previous tip of the branch, or for a new branch, the parent commit.
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
          if [ -z "$base" ]; then
            echo "No earlier commit to compare with."
            exit 0
          fi
          echo "Comparing with $base"
          git worktree add "$RUNNER_TEMP/base" "$base"
          cp include/asset_enums.h "$RUNNER_TEMP/base/include/"
          if make -C "$RUNNER_TEMP/base/port" TARGET=host -j"$(nproc)"; then
            echo "exe=$RUNNER_TEMP/base/port/build/host/dkr" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The previous commit ($base) doesn't build; frames are not compared."
          fi

      - name: Frame regression
        env:
          BASE_EXE: ${{ steps.base.outputs.exe }}
        run: |
          python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr ${BASE_EXE:+--base "$BASE_EXE"} --out "$RUNNER_TEMP/regression" --max-images 0

      - name: Texture memo check
        # P56 K4: the Old 3DS's texture lookup memo (off by default on a PC) checked against the full lookup at every
        # memo hit (DKR_TEX_MEMO_CHECK, gfx_rdp.c tex_memo_check_answer), over the same scenarios. Any difference is a
        # memo bug; no "hits checked" line means the check never ran.
        run: |
          DKR_TEX_MEMO=1 DKR_TEX_MEMO_CHECK=1 python3 port/tools/frame_regression.py \
            --rom "$RUNNER_TEMP/rom/baserom.z64" --head port/build/host/dkr --out "$RUNNER_TEMP/memo-check" \
            --max-images 0 --no-repeat-check
          logs=$(find "$RUNNER_TEMP/memo-check" -name log.txt)
          grep -h "texture memo check:" $logs | tail -n 20
          {
            echo "### Texture memo check"
            echo
            for log in $logs; do
              echo "- $(basename "$(dirname "$(dirname "$log")")"): $(grep "hits checked" "$log" | tail -n 1 | sed 's/.*texture memo check: //')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "texture memo check: first difference" $logs; then
            echo "::error::The texture memo gave a different texture from the full lookup (see the log line above)."
            exit 1
          fi
          if ! grep -q "texture memo check: .* hits checked" $logs; then
            echo "::error::The texture memo check never ran (no memo hits in any scenario)."
            exit 1
          fi

      - name: Fog skip check
        # P60 C: DKR_FOG_SKIP leaves out the per-vertex fog factor where nothing reads it, so the same build must draw
        # identical frames with it on and off (first run). The second run keeps the backend on per-vertex fog
        # (DKR_VERTEX_FOG=1, both builds), where the switch must turn itself off: dropping that test was this check's
        # break-once (rule K6), and it reported 99 of 112 frames different. A run with no factors left out fails too.
        run: |
          python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" --head port/build/host/dkr \
            --base port/build/host/dkr --head-env DKR_FOG_SKIP=1 --out "$RUNNER_TEMP/fog-skip" --max-images 0 \
            --no-repeat-check --fail-on-diff
          DKR_VERTEX_FOG=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --base port/build/host/dkr --head-env DKR_FOG_SKIP=1 --only levels \
            --out "$RUNNER_TEMP/fog-skip-vertex" --max-images 0 --no-repeat-check --fail-on-diff
          logs=$(find "$RUNNER_TEMP/fog-skip/runs" -path "*/head/log.txt")
          grep -h "fog skip:" $logs | tail -n 5
          if ! grep -q "fog skip: [1-9][0-9]* fog factors left out" $logs; then
            echo "::error::DKR_FOG_SKIP left no fog factor out in any scenario (the switch never engaged)."
            exit 1
          fi

      - name: Split ref check
        # P63: DKR_SPLIT_REF hands the opaque buckets to the two-core renderer's backend by pointer, so the same build
        # must draw identical frames with its self-check on (DKR_SPLIT_REF_CHECK=2: every hand-off compared by the
        # backend with a queued copy, returned blocks filled with 0xA5), with the Old 3DS defaults, and report 0 differ.
        # Mode 3 is the check broken on purpose (rule K6: blocks returned one draw early) and must report differences.
        run: |
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --base port/build/host/dkr --head-env DKR_SPLIT_REF_CHECK=2 \
            --out "$RUNNER_TEMP/split-ref" --max-images 0 --no-repeat-check --fail-on-diff
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --head-env DKR_SPLIT_REF_CHECK=3 --only levels \
            --out "$RUNNER_TEMP/split-ref-broken" --max-images 0 --no-repeat-check
          logs=$(find "$RUNNER_TEMP/split-ref/runs" -path "*/head/log.txt")
          broken=$(find "$RUNNER_TEMP/split-ref-broken/runs" -path "*/head/log.txt")
          grep -h "split ref:" $logs $broken | tail -n 8
          if grep -q "split ref: first difference" $logs; then
            echo "::error::A handed-over bucket block changed before the backend drew it (see the log line above)."
            exit 1
          fi
          if ! grep -q "split ref: [1-9][0-9]* handed over, .* [1-9][0-9]* compared, 0 differ" $logs; then
            echo "::error::The split ref check never compared a hand-off (the switch never engaged)."
            exit 1
          fi
          if ! grep -q "split ref: first difference" $broken; then
            echo "::error::The split ref check broken on purpose (DKR_SPLIT_REF_CHECK=3) reported nothing."
            exit 1
          fi

      - name: Split lines check
        # P66: DKR_SPLIT_LINES hands the split ring's head and tail over in batches, so the same build must draw
        # identical frames with its self-check on (DKR_SPLIT_LINES_CHECK=1: the backend compares every frame's records
        # with the walk's) and the Old 3DS defaults, and report 0 differ. Modes 2 and 3 are the check broken on purpose
        # (rule K6: a draw record lost; a frame's end not handed over) and must report it.
        run: |
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --base port/build/host/dkr --head-env DKR_SPLIT_LINES_CHECK=1 \
            --out "$RUNNER_TEMP/split-lines" --max-images 0 --no-repeat-check --fail-on-diff
          for m in 2 3; do
            DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
              --head port/build/host/dkr --head-env DKR_SPLIT_LINES_CHECK=$m --only levels \
              --out "$RUNNER_TEMP/split-lines-broken$m" --max-images 0 --no-repeat-check
          done
          logs=$(find "$RUNNER_TEMP/split-lines/runs" -path "*/head/log.txt")
          lost=$(find "$RUNNER_TEMP/split-lines-broken2/runs" -path "*/head/log.txt")
          late=$(find "$RUNNER_TEMP/split-lines-broken3/runs" -path "*/head/log.txt")
          grep -h "split lines:" $logs $lost $late | tail -n 8
          if grep -q "split lines: first difference" $logs; then
            echo "::error::The split ring lost, tore or delayed a record with DKR_SPLIT_LINES (see the log line above)."
            exit 1
          fi
          if ! grep -q "split lines: [1-9][0-9]* frames compared, 0 differ, 0 frame ends" $logs; then
            echo "::error::The split lines check never compared a frame (the switch never engaged)."
            exit 1
          fi
          if ! grep -q "split lines: first difference .*(1 frames differ" $lost; then
            echo "::error::The split lines check broken on purpose (DKR_SPLIT_LINES_CHECK=2, a lost record) reported nothing."
            exit 1
          fi
          if ! grep -q "split lines: first difference .* 1 frame ends not handed over" $late; then
            echo "::error::The split lines check broken on purpose (DKR_SPLIT_LINES_CHECK=3, a frame end kept) reported nothing."
            exit 1
          fi

      - name: Kart resident check
        # P68 step 4: DKR_KART_RESIDENT draws unchanged kart pieces from meshes kept on the GPU, so the same build must
        # draw identical frames with its self-check on (DKR_KART_RESIDENT_CHECK=1: every kept draw made again the usual
        # way and compared), on top of slim kart runs with the Old 3DS defaults, and report 0 wrong. Modes 2 and 3 are
        # the check broken on purpose (rule K6: changed vertices taken as unchanged; a kept box too small) and must
        # report it.
        run: |
          DKR_HOST_OLD3DS=1 DKR_KART_BATCH=2 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --base port/build/host/dkr --head-env DKR_KART_RESIDENT_CHECK=1 --only levels \
            --out "$RUNNER_TEMP/kart-resident" --max-images 0 --no-repeat-check --fail-on-diff
          for m in 2 3; do
            DKR_HOST_OLD3DS=1 DKR_KART_BATCH=2 python3 port/tools/frame_regression.py \
              --rom "$RUNNER_TEMP/rom/baserom.z64" --head port/build/host/dkr --head-env DKR_KART_RESIDENT_CHECK=$m \
              --only levels --out "$RUNNER_TEMP/kart-resident-broken$m" --max-images 0 --no-repeat-check
          done
          logs=$(find "$RUNNER_TEMP/kart-resident/runs" -path "*/head/log.txt")
          grep -h "kart pieces kept\|kart resident check" $logs | tail -n 4
          if grep -q "kart resident check: a kept mesh" $logs; then
            echo "::error::A kept kart mesh differs from the piece drawn the usual way (see the log line above)."
            exit 1
          fi
          if ! grep -q "kart resident check: [1-9][0-9]* kept draws compared, 0 wrong" $logs; then
            echo "::error::The kart resident check never compared a kept draw (the switch never engaged)."
            exit 1
          fi
          for m in 2 3; do
            if ! grep -q "kart resident check: a kept mesh" $(find "$RUNNER_TEMP/kart-resident-broken$m/runs" -path "*/head/log.txt"); then
              echo "::error::The kart resident check broken on purpose (DKR_KART_RESIDENT_CHECK=$m) reported nothing."
              exit 1
            fi
          done
      - name: 60 Hz picture check
        # S8 / P39 (proposals/3ds-interp60-plan.md): DKR_INTERP60=1 on two races (Whale Bay, then the desert track;
        # the attract demo before them). The host draws each frame's in-between picture from the walk's deltas
        # (gfx_soft.c); it must lie between the real pictures before and after it in at least 90% of the frames that
        # move, the walk's self-check (C D against C') and the 3DS backend's conversion check (gfx_interp_math.h) must
        # say 0 wrong, and most frames must be drawn as two pictures. Rule K6: DKR_INTERP60_CHECK=2 (S^-1 left out of
        # the backend's conversion) and 3 (the walk's C^-1 P transposed) are the checks broken on purpose; each must
        # report wrong deltas (2026-11-23: 7822 of 7822 and 2539 of 3450, and the broken walk put 3 of 427 moving
        # frames between their neighbours).
        run: |
          d="$RUNNER_TEMP/interp60"
          mkdir -p "$d"
          ln -sf "$RUNNER_TEMP/rom/baserom.z64" "$d/baserom.z64"
          for m in 1 2 3; do
            DKR_LOCKSTEP=1 DKR_DATA_DIR="$d" DKR_FRAMES=750 DKR_WARP=13,16 DKR_WARP_SECONDS=4 DKR_INTERP60=1 \
              DKR_INTERP60_CHECK=$m timeout 600 port/build/host/dkr > "$d/log$m.txt" 2>&1
            grep "60 Hz picture" "$d/log$m.txt" | tail -n 5
          done
          last() { grep "$1" "$d/log$2.txt" | tail -n 1; }
          host=$(last "60 Hz picture host check" 1)
          between=$(echo "$host" | sed -n 's/.*; \([0-9]*\) of \([0-9]*\) moving.*/\1 \2/p')
          set -- $between
          if [ -z "$2" ] || [ "$2" -lt 100 ] || [ $(( $1 * 10 )) -lt $(( $2 * 9 )) ]; then
            echo "::error::Too few in-between pictures lie between their neighbours: $host"
            exit 1
          fi
          two=$(echo "$host" | sed -n 's/.*check: \([0-9]*\) frames as two pictures, \([0-9]*\) as one.*/\1 \2/p')
          set -- $two
          if [ -z "$2" ] || [ "$1" -lt $(( $2 * 10 )) ]; then
            echo "::error::Too few frames drawn as two pictures: $host"
            exit 1
          fi
          if ! last "60 Hz picture walk check" 1 | grep -q "[1-9][0-9]* deltas checked, 0 wrong" ||
             ! last "60 Hz picture backend check" 1 | grep -q "[1-9][0-9]* deltas checked, 0 wrong"; then
            echo "::error::The 60 Hz picture's self-checks found wrong deltas (or never ran)."
            exit 1
          fi
          if last "60 Hz picture backend check" 2 | grep -q " 0 wrong"; then
            echo "::error::The backend check broken on purpose (DKR_INTERP60_CHECK=2) reported nothing."
            exit 1
          fi
          if last "60 Hz picture walk check" 3 | grep -q " 0 wrong"; then
            echo "::error::The walk check broken on purpose (DKR_INTERP60_CHECK=3) reported nothing."
            exit 1
          fi

      - name: Sprite table check
        # P65 rank 1: DKR_SPRITE_TABLE hands billboard tiles over as the game's vertices with one matrix per load. Its
        # self-check (DKR_SPRITE_TABLE_CHECK=1) makes every corner both ways (gfx_tab_corner, and the old way's
        # load_vertices_core + sprite_corner) and must report 0 differ with the Old 3DS defaults. Mode 2 is the check
        # broken on purpose (rule K6: the anchor's x left out of each group) and must report differences.
        run: |
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --head-env DKR_SPRITE_TABLE=1 --head-env DKR_SPRITE_TABLE_CHECK=1 --only levels \
            --out "$RUNNER_TEMP/sprite-table" --max-images 0 --no-repeat-check
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --head-env DKR_SPRITE_TABLE=1 --head-env DKR_SPRITE_TABLE_CHECK=2 --only levels \
            --out "$RUNNER_TEMP/sprite-table-broken" --max-images 0 --no-repeat-check
          logs=$(find "$RUNNER_TEMP/sprite-table/runs" -path "*/head/log.txt")
          broken=$(find "$RUNNER_TEMP/sprite-table-broken/runs" -path "*/head/log.txt")
          grep -h "sprite table" $logs $broken | tail -n 8
          if grep -q "sprite table check: .*(DIFFER)" $logs; then
            echo "::error::The sprite table's corners differ from the old way's (see the log lines above)."
            exit 1
          fi
          if ! grep -q "sprite table check: [1-9][0-9]* corners compared, 0 differ" $logs; then
            echo "::error::The sprite table check never compared a corner (the switch never engaged)."
            exit 1
          fi
          if ! grep -q "sprite table check: .*(DIFFER)" $broken; then
            echo "::error::The sprite table check broken on purpose (DKR_SPRITE_TABLE_CHECK=2) reported nothing."
            exit 1
          fi

      - name: Flat dispatcher check
        # P55 S4 step 1: DKR_FLAT_FRAME runs race frames on the flat dispatcher (nframe.c run_flat_frame, the record
        # path native_record_flat), which must draw frames identical to the record dispatcher's with the Old 3DS
        # defaults, its self-check on (DKR_FLAT_FRAME_CHECK=1) reporting 0 wrong. Mode 2 is the check broken on purpose
        # (rule K6: the kart counts turned on mid-frame, a path the flat record lacks) and must report wrong records.
        run: |
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --base port/build/host/dkr --head-env DKR_FLAT_FRAME=1 \
            --head-env DKR_FLAT_FRAME_CHECK=1 --out "$RUNNER_TEMP/flat-frame" --max-images 0 --no-repeat-check \
            --fail-on-diff
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --head-env DKR_FLAT_FRAME=1 --head-env DKR_FLAT_FRAME_CHECK=2 --only levels \
            --out "$RUNNER_TEMP/flat-frame-broken" --max-images 0 --no-repeat-check
          logs=$(find "$RUNNER_TEMP/flat-frame/runs" -path "*/head/log.txt")
          broken=$(find "$RUNNER_TEMP/flat-frame-broken/runs" -path "*/head/log.txt")
          grep -h "flat frame:" $logs $broken | tail -n 6
          if ! grep -q "flat frame: [1-9][0-9]* frames flat, .* [1-9][0-9]* records checked, 0 wrong" $logs; then
            echo "::error::The flat dispatcher never ran a frame, or its self-check found records run flat with a path it lacks."
            exit 1
          fi
          if grep -q "flat frame: .* [1-9][0-9]* wrong" $logs; then
            echo "::error::The flat dispatcher's self-check found records run flat with a path it lacks (see above)."
            exit 1
          fi
          if ! grep -q "flat frame: .* [1-9][0-9]* wrong" $broken; then
            echo "::error::The flat dispatcher check broken on purpose (DKR_FLAT_FRAME_CHECK=2) reported nothing."
            exit 1
          fi

      - name: Flat record handles check
        # P55 S4 stage 2: DKR_FLAT_RES (on flat frames, DRAW records find their tables by a handle kept per material
        # id, track records reuse the clip matrix) must draw frames identical to the record dispatcher's with the Old
        # 3DS defaults, its self-check on (DKR_FLAT_RES_CHECK=1: each handle against the tables' search, each reused
        # matrix against a new one) reporting 0 wrong. Mode 2 is the check broken on purpose (rule K6: each frame's
        # first comparison given a wrong value) and must report.
        run: |
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --base port/build/host/dkr --head-env DKR_FLAT_FRAME=1 --head-env DKR_FLAT_RES=1 \
            --head-env DKR_FLAT_RES_CHECK=1 --out "$RUNNER_TEMP/flat-res" --max-images 0 --no-repeat-check \
            --fail-on-diff
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --head-env DKR_FLAT_FRAME=1 --head-env DKR_FLAT_RES=1 \
            --head-env DKR_FLAT_RES_CHECK=2 --only levels --out "$RUNNER_TEMP/flat-res-broken" --max-images 0 \
            --no-repeat-check
          logs=$(find "$RUNNER_TEMP/flat-res/runs" -path "*/head/log.txt")
          broken=$(find "$RUNNER_TEMP/flat-res-broken/runs" -path "*/head/log.txt")
          grep -h "flat res:" $logs $broken | tail -n 6
          if ! grep -q "flat res: .* [1-9][0-9]* handle hits, .* [1-9][0-9]* checked, 0 wrong" $logs; then
            echo "::error::The flat record handles never hit, or their self-check found a wrong handle or matrix."
            exit 1
          fi
          if grep -q "flat res: .* [1-9][0-9]* wrong" $logs; then
            echo "::error::The flat record handles' self-check found a wrong handle or matrix (see above)."
            exit 1
          fi
          if ! grep -q "flat res: .* [1-9][0-9]* wrong" $broken; then
            echo "::error::The flat record handles check broken on purpose (DKR_FLAT_RES_CHECK=2) reported nothing."
            exit 1
          fi

      - name: Track bake check
        # P55 S1: DKR_TRACK_BAKE makes the native track's meshes during the level load, so the same build must draw
        # identical frames with it on (the Old 3DS defaults have the native track on), with its self-check on
        # (DKR_TRACK_BAKE_CHECK=1: baked meshes hashed again as the game runs) reporting 0 differ, and every batch
        # baked (0 meshes made after the load). Mode 2 is the check broken on purpose (rule K6: the invalidation of a
        # baked batch the game scrolls is dropped) and must report differences.
        run: |
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --base port/build/host/dkr --head-env DKR_TRACK_BAKE=1 \
            --head-env DKR_TRACK_BAKE_CHECK=1 --out "$RUNNER_TEMP/track-bake" --max-images 0 --no-repeat-check \
            --fail-on-diff
          DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
            --head port/build/host/dkr --head-env DKR_TRACK_BAKE=1 --head-env DKR_TRACK_BAKE_CHECK=2 --only levels \
            --out "$RUNNER_TEMP/track-bake-broken" --max-images 0 --no-repeat-check
          logs=$(find "$RUNNER_TEMP/track-bake/runs" -path "*/head/log.txt")
          broken=$(find "$RUNNER_TEMP/track-bake-broken/runs" -path "*/head/log.txt")
          grep -h "track bake" $logs $broken | grep -v "^track bake (" | tail -n 8
          if ! grep -q "^track bake (during the load, level load [0-9]*): [1-9][0-9]* batches" $logs; then
            echo "::error::The track was never baked during a load (the switch never engaged)."
            exit 1
          fi
          if grep -q "track bake check: a .* mesh differs" $logs; then
            echo "::error::A baked track mesh no longer matches its batch (see the log line above)."
            exit 1
          fi
          if grep "track bake check: [0-9]* compared" $logs | grep -qv " 0 meshes made after the load"; then
            echo "::error::The bake missed track batches the game drew (meshes made after the load)."
            exit 1
          fi
          if ! grep -q "track bake check: [1-9][0-9]* compared, 0 differ" $logs; then
            echo "::error::The track bake check never compared a mesh."
            exit 1
          fi
          if ! grep -q "track bake check: [0-9]* compared, [1-9][0-9]* differ" $broken; then
            echo "::error::The track bake check broken on purpose (DKR_TRACK_BAKE_CHECK=2) reported nothing."
            exit 1
          fi

      - name: Kart two-matrix check
        # P68 step 5: DKR_KART_MTX2 draws two-load kart batches with the two-matrix shader; its self-check makes every
        # corner again with its own load's matrix (DKR_KART_MTX2_CHECK=1) and must report 0 wrong with the Old 3DS
        # defaults. Mode 2 is the check broken on purpose (rule K6: one corner on the other matrix) and must report it.
        run: |
          for m in 1 2; do
            DKR_HOST_OLD3DS=1 python3 port/tools/frame_regression.py --rom "$RUNNER_TEMP/rom/baserom.z64" \
              --head port/build/host/dkr --head-env DKR_KART_MTX2_CHECK=$m --only levels \
              --out "$RUNNER_TEMP/kart-mtx2-$m" --max-images 0 --no-repeat-check
          done
          logs=$(find "$RUNNER_TEMP/kart-mtx2-1/runs" -path "*/head/log.txt")
          broken=$(find "$RUNNER_TEMP/kart-mtx2-2/runs" -path "*/head/log.txt")
          grep -h "two-matrix kart\|kart two-matrix check" $logs | tail -n 2
          if grep -q "kart two-matrix check: a draw" $logs; then
            echo "::error::A two-matrix kart draw differs from its corners made with their own load's matrix."
            exit 1
          fi
          if ! grep -q "kart two-matrix check: [1-9][0-9]* draws compared, 0 wrong" $logs; then
            echo "::error::The kart two-matrix check never compared a draw (the switch never engaged)."
            exit 1
          fi
          if ! grep -q "kart two-matrix check: a draw" $broken; then
            echo "::error::The kart two-matrix check broken on purpose (DKR_KART_MTX2_CHECK=2) reported nothing."
            exit 1
          fi
      # P56 D: the 3DS backend (port/3ds/gfx_c3d.c) on the PC through the real citro3d, fed the draws the host build
      # records in the frame regression scenarios. Fails when this commit changes the backend's command words
      # (unless the commit message says "backend-change: expected") or when the state cache leaves a GPU register
      # different from sending every setting for every draw. See port/tools/backend_replay.py.
      - name: Cache the backend replay's libctru, citro3d and picasso
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/replay-deps
          key: replay-deps-${{ hashFiles('port/tools/backend_replay.py') }}

      - name: Backend replay
        if: ${{ !cancelled() }}
        run: |
          base=""
          if [ -d "$RUNNER_TEMP/base/port/3ds" ]; then base="--base-port $RUNNER_TEMP/base/port"; fi
          python3 port/tools/backend_replay.py ci --deps "$RUNNER_TEMP/replay-deps" --exe port/build/host/dkr \
            --rom "$RUNNER_TEMP/rom/baserom.z64" --work "$RUNNER_TEMP/replay" $base

      # P65 (proposals/3ds-custom-shader-plan.md): the shader blob run on a simulated PICA200 (port/tools/pica_sim.py,
      # 24-bit floats): the slim track shader (track.v.pica) must give the same outputs as transform.v.pica for unlit
      # draws, and the wave shader (waves.v.pica) the game's own sums for a wave vertex (port/tools/pica_wave_check.py).
      # Each check is also run broken on purpose and must then report (rule K6). Uses the replay's picasso. anim.v.pica
      # (keyframe blending, not in the game's blob until karts keep their meshes on the GPU) is checked in a blob of its own.
      - name: Shader checks
        if: ${{ !cancelled() }}
        run: |
          picasso="$RUNNER_TEMP/replay-deps/picasso/picasso"
          srcs=$(sed -n '/^SHADER_SRC/,/[^\\]$/p' port/3ds/rules.mk | sed 's/^SHADER_SRC *:=//; s/\\//g')
          (cd port && "$picasso" -o "$RUNNER_TEMP/shader-check.shbin" $srcs)
          python3 port/tools/pica_sim.py check "$RUNNER_TEMP/shader-check.shbin"
          # The anim shader is not in the game's blob yet (no room for its uniform beside the sprite table's), so it is
          # checked in a blob of its own with the transform shader it is measured against.
          (cd port && "$picasso" -o "$RUNNER_TEMP/anim-check.shbin" 3ds/shader.v.pica 3ds/transform.v.pica 3ds/anim.v.pica)
          python3 port/tools/pica_sim.py check "$RUNNER_TEMP/anim-check.shbin"

      - name: Upload the backend replay's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-replay
          path: |
            ${{ runner.temp }}/replay/out/report.md
            ${{ runner.temp }}/replay/out/words-diff.txt
            ${{ runner.temp }}/replay/out/state-diff.txt
            ${{ runner.temp }}/replay/out/raw-diff.txt
            ${{ runner.temp }}/replay/out/walk-diff.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-regression
          # The report and each run's log only: no frames, since they are pictures of the game and the repository
          # is public. Run port/tools/frame_regression.py locally to see the differing frames.
          path: |
            ${{ runner.temp }}/regression/report.md
            ${{ runner.temp }}/regression/runs/*/*/log.txt
          if-no-files-found: ignore
          retention-days: 7
